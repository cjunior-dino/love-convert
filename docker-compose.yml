services:
  backend:
    build:
      context: .
      target: backend
    init: true
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY no arquivo .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_STATIC_ROOT: /app/staticfiles
    volumes:
      - database_data:/app/data
      - conversion_files:/app/media
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; connection = socket.create_connection(('127.0.0.1', 8000), 2); connection.close()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      APP_SITE: ${APP_SITE:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  database_data:
  conversion_files:
  caddy_data:
  caddy_config:
