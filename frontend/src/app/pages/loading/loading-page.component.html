<main class="page-shell process-page">
  @if (!errorMessage) {
    <section class="process-card" aria-live="polite" aria-busy="true">
      <p class="process-card__eyebrow">{{ i18n.t('loading.secure') }}</p>
      <h1>{{ progressTitle }}</h1>
      <mat-spinner diameter="74" [attr.aria-label]="i18n.t('loading.inProgress')"></mat-spinner>
      <p>{{ i18n.t('loading.wait') }}</p>
    </section>
  } @else {
    <section class="process-card process-card--error" role="alert">
      <div class="error-badge" aria-hidden="true">!</div>
      <h1>{{ i18n.t('loading.failedTitle') }}</h1>
      <p>{{ errorMessage }}</p>
      <a mat-flat-button routerLink="/">{{ i18n.t('loading.tryAnother') }}</a>
    </section>
  }
</main>
