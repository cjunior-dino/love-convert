<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/" [attr.aria-label]="i18n.t('app.brandHome')">
      <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="5" y="6" width="26" height="31" rx="8"></rect>
        <rect x="17" y="12" width="26" height="31" rx="8"></rect>
      </svg>
      <span class="brand__copy">
        <strong><em>iLove</em>-Convert</strong>
        <small>ilove-convert.online</small>
      </span>
    </a>

    <nav class="main-nav" [attr.aria-label]="i18n.t('app.mainNavigation')">
      <a class="main-nav__link main-nav__link--active" routerLink="/">{{ i18n.t('nav.home') }}</a>
      <a class="main-nav__link" routerLink="/" fragment="how-it-works">{{ i18n.t('nav.howItWorks') }}</a>
    </nav>

    <div class="topbar__actions">
      <label class="language-selector">
        <span aria-hidden="true">🌐</span>
        <span class="visually-hidden">{{ i18n.t('language.selector') }}</span>
        <select
          [value]="i18n.locale()"
          [attr.aria-label]="i18n.t('language.selector')"
          (change)="setLanguage($event)"
        >
          @for (option of i18n.options; track option.code) {
            <option [value]="option.code" [attr.title]="option.label">
              {{ option.shortLabel }}
            </option>
          }
        </select>
      </label>

      <a class="privacy-link" routerLink="/" fragment="privacy">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 5.5 5.6v5.2c0 4.3 2.7 8.1 6.5 9.4 3.8-1.3 6.5-5.1 6.5-9.4V5.6L12 3Z"></path>
        </svg>
        {{ i18n.t('nav.privacy') }}
      </a>
    </div>
  </div>
</header>

<router-outlet></router-outlet>

<footer>
  <div class="footer__brand">
    <strong><em>iLove</em>-Convert</strong>
    <span>ilove-convert.online</span>
  </div>
  <span>{{ i18n.t('footer.tagline') }}</span>
</footer>
